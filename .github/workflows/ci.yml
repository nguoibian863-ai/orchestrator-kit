name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # powershell = Windows PowerShell 5.1, pwsh = PowerShell 7.
        # Khong dung "shell: ${{ matrix.* }}": GitHub tu choi ca file workflow
        # (startup failure, khong bao loi ro). Goi trinh thong dich tuong minh thay vi vay.
        ps: [powershell, pwsh]

    steps:
      - uses: actions/checkout@v4

      - name: Phien ban PowerShell va git
        shell: cmd
        run: |
          ${{ matrix.ps }} -NoProfile -Command "$PSVersionTable.PSVersion.ToString()"
          git --version

      - name: Kiem tra cu phap va BOM cua file .ps1
        shell: cmd
        run: ${{ matrix.ps }} -NoProfile -ExecutionPolicy Bypass -File .github/scripts/check-scripts.ps1

      - name: Smoke test
        shell: cmd
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          git config --global commit.gpgsign false
          ${{ matrix.ps }} -NoProfile -ExecutionPolicy Bypass -File tests/smoke.ps1
