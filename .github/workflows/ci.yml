name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Khong dat ten khoa matrix la "shell": GitHub tu choi ca file workflow.
        ps: [powershell, pwsh]

    steps:
      - uses: actions/checkout@v4

      - name: Phien ban PowerShell va git
        shell: ${{ matrix.ps }}
        run: |
          $PSVersionTable.PSVersion.ToString()
          git --version

      - name: Kiem tra cu phap va BOM cua file .ps1
        shell: ${{ matrix.ps }}
        run: .github/scripts/check-scripts.ps1

      - name: Smoke test
        shell: ${{ matrix.ps }}
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          git config --global commit.gpgsign false
          tests/smoke.ps1
